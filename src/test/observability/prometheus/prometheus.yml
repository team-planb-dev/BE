# 컨테이너 경로 기준의 로컬 부하 측정용 Prometheus 설정
# 30초 부하 측정용 2초 scrape 간격과 8초 이상의 rate() 구간
global:
  scrape_interval: 2s
  scrape_timeout: 2s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 사용자 JWT가 필요한 애플리케이션 관리 포트와 임시 토큰 파일
  # type 생략 시 기본 Bearer 인증 헤더 사용
  # 지표를 제공하지 않는 스텁 서버(18080, 18081)의 병목 판별 불가
  - job_name: travel-app
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /etc/prometheus/scrape-token/token
    static_configs:
      - targets: ['host.docker.internal:8081']
