# 부하 테스트 전용 프로파일. 실행: --spring.profiles.active=loadtest

# OpenAI와 외부 HTTP API 네 개의 로컬 스텁 사용
# 스텁 실행: ./gradlew travelLoadTestStubs

# 실제 키 사용 방지를 위한 외부 API 키 환경변수 미참조
# 근거와 사용법은 docs/perf/phase2-openai-stub.md와 docs/perf/phase2-external-http-stubs.md 참고
spring:
  config:
    activate:
      on-profile: common-loadtest
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 500
    open-in-view: false

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  ai:
    openai:
      api-key: loadtest-no-key
      timeout: 20s
      max-retries: 0
      chat:
        base-url: ${LOADTEST_OPENAI_STUB_URL:http://localhost:18081}/v1
        model: ${OPENAI_MODEL:loadtest-model}
        reasoning-effort: ${OPENAI_REASONING_EFFORT:none}
    mcp:
      server:
        protocol: streamable

server:
  tomcat:
    mbeanregistry:
      enabled: true


jwt:
  secret: ${JWT_SECRET}

external:
  kor2-service:
    base-url: ${LOADTEST_STUB_URL:http://localhost:18080}/kor2
    service-key: loadtest

  kakao-map:
    base-url: ${LOADTEST_STUB_URL:http://localhost:18080}/kakao-map
    api-key: loadtest

  kakao-mobility:
    base-url: ${LOADTEST_STUB_URL:http://localhost:18080}/kakao-mobility
    api-key: loadtest

  food-ntr-cpnt:
    base-url: ${LOADTEST_STUB_URL:http://localhost:18080}/food-nutrition
    service-key: loadtest

# Phase 4A: 부하 측정 p50/p95/p99용 SLO 버킷, loadtest 프로파일 한정
# 기본 Timer의 _count·_sum·_max만으로는 histogram_quantile 계산 불가
# 긴 일정 생성을 위한 percentile histogram 최대 300초 버킷 경계
# Phase 4A-2의 OpenAI 3초 지연 2회 측정을 위한 3초·6초·8초 경계
# http.client.requests와 횟수·결과만 집계하는 planb.ai.retry의 버킷 제외
management:
  metrics:
    distribution:
      slo:
        planb.travel.ai.orchestration: 50ms,100ms,250ms,500ms,1s,2s,3s,5s,6s,8s,10s,20s,30s,60s,120s,300s
        http.server.requests: 10ms,50ms,100ms,250ms,500ms,1s,2s,3s,5s,6s,8s,10s,20s,30s,60s,120s,300s
