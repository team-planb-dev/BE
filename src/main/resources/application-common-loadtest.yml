# 부하 테스트 전용 프로파일. 실행: --spring.profiles.active=loadtest
#
# OpenAI와 외부 HTTP API 네 개(Kor2Service, Kakao Map, Kakao Mobility, 식품영양성분)를 로컬 스텁으로 돌린다.
# 스텁 실행: ./gradlew travelLoadTestStubs
#
# 외부 API 키는 환경변수에서 읽지 않는다. 실행 셸에 실제 키가 있어도 부하 테스트가 실제 키를 쓰지 않게 하려는 것이다.
# 근거와 사용법은 docs/perf/phase2-openai-stub.md와 docs/perf/phase2-external-http-stubs.md 참고.
spring:
  config:
    activate:
      on-profile: common-loadtest
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 500
    open-in-view: false

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  ai:
    openai:
      api-key: loadtest-no-key
      chat:
        base-url: ${LOADTEST_OPENAI_STUB_URL:http://localhost:18081}/v1
        model: ${OPENAI_MODEL:loadtest-model}
        reasoning-effort: ${OPENAI_REASONING_EFFORT:none}
    mcp:
      server:
        protocol: streamable


jwt:
  secret: ${JWT_SECRET}

external:
  kor2-service:
    base-url: ${LOADTEST_STUB_URL:http://localhost:18080}/kor2
    service-key: loadtest

  kakao-map:
    base-url: ${LOADTEST_STUB_URL:http://localhost:18080}/kakao-map
    api-key: loadtest

  kakao-mobility:
    base-url: ${LOADTEST_STUB_URL:http://localhost:18080}/kakao-mobility
    api-key: loadtest

  food-ntr-cpnt:
    base-url: ${LOADTEST_STUB_URL:http://localhost:18080}/food-nutrition
    service-key: loadtest

# Phase 4A-1: 부하 측정에서 p50/p95/p99를 Prometheus로 계산하기 위한 SLO 버킷. loadtest 프로파일에만 적용한다.
# 기본 Timer는 _count·_sum·_max만 내보내 histogram_quantile을 쓸 수 없고, percentile histogram 기본 범위는
# 30초에서 끊긴다. 긴 일정 생성을 보려고 300초까지 이어지는 경계를 직접 지정한다.
# 경계는 잠정값이다. Phase 4A-2에서 OpenAI 고정 지연이 정해지면 실행 전에 확정한다.
# http.client.requests는 의존성 구분이 생기기 전까지, planb.ai.retry는 횟수와 결과만 보므로 버킷을 두지 않는다.
management:
  metrics:
    distribution:
      slo:
        planb.travel.ai.orchestration: 50ms,100ms,250ms,500ms,1s,2s,5s,10s,20s,30s,60s,120s,300s
        http.server.requests: 10ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s,20s,30s,60s,120s,300s
