server:
  # Railway 등 배포 환경의 PORT 바인딩
  # Spring Boot의 PORT 미인식에 따른 명시적 연결
  port: ${PORT:8080}

  # 프록시 TLS 종료 후 HTTP 수신 시 원래 HTTPS 스킴 복원
  # X-Forwarded-Proto 미반영에 따른 Swagger UI 혼합 콘텐츠 차단 방지
  # 프록시 헤더가 없는 로컬 환경에는 영향 없음
  forward-headers-strategy: framework

spring:
  application:
    name: default-setting # 애플리케이션 기본 이름
  http:
    clients:
      connect-timeout: ${EXTERNAL_HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${EXTERNAL_HTTP_READ_TIMEOUT:15s}
  profiles:
    active: local
    group:
      test: common-test
      local: common-local
      dev: common-dev
      prod: common-prod
      loadtest: common-loadtest

decorator:
  datasource:
    exclude-beans: dataSource, routingDataSource

Logging:
  level:
    # Spring AI Tool 호출당 DEBUG 로그 4줄 축소
    # Tool 인자는 TourismTool INFO 로그에서 확인, 근거: docs/perf/log-observability-round1.md
    org.springframework.ai: INFO
    com.planb.global.client: DEBUG
    org.springframework.core.LocalVariableTableParameterNameDiscoverer: error # 오류 로그만 기록

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
